<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>拼豆图纸 · 像素头像生成器</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --ink: #1C1917; --brand: #D97757; --paper: #F7F4F0; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
  .layout { display: flex; flex-direction: column; gap: 22px; }
  .preview { order: 1; min-width: 0; }
  .panel { order: 2; }

  .upload {
    display: flex; align-items: center; gap: 14px; width: 100%;
    padding: 16px; border: 2px dashed #C7BFB6; border-radius: 14px;
    background: #FCFAF7; cursor: pointer; text-align: left; color: var(--ink);
    font: inherit; transition: border-color .15s, background .15s;
  }
  .upload:hover { border-color: var(--brand); background: #FBF0EA; }
  .upload.is-filled { border-style: solid; border-color: var(--brand); background: #FBF0EA; }
  .upload .plus {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--brand); color: #fff; font-size: 26px; font-weight: 800; line-height: 1;
  }
  .upload .upload-texts { min-width: 0; }
  #uploadTitle {
    display: block; font-size: 16px; font-weight: 800;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px;
  }
  #uploadSub { display: block; font-size: 12px; color: #78716C; margin-top: 2px; }

  .opt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .opt-card {
    display: block; width: 100%; padding: 12px; border: 2px solid #DDD6CE;
    border-radius: 12px; background: #fff; text-align: center; cursor: pointer;
    color: var(--ink); font: inherit; transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .opt-card:hover { border-color: #A8A29E; }
  .opt-card.is-active {
    border-color: var(--brand); background: #FBF0EA;
    box-shadow: 0 0 0 3px rgba(217, 119, 87, .14);
  }
  .opt-name { display: block; font-size: 17px; font-weight: 800; }
  .opt-meta { display: block; font-size: 12px; color: #78716C; margin-top: 2px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 16px; border: 1.5px solid #DDD6CE; border-radius: 999px;
    background: #fff; color: #57534E; font: inherit; font-size: 14px;
    line-height: 1.2; cursor: pointer; transition: border-color .15s, background .15s, color .15s;
  }
  .chip:hover { border-color: var(--brand); color: #B45309; }
  .chip.is-on { border-color: var(--brand); background: #FBF0EA; color: #B45309; font-weight: 700; }

  .seg {
    display: flex; padding: 4px; border-radius: 12px;
    background: #EDE8E2; border: 1px solid #E0D9D0;
  }
  .seg button {
    flex: 1 1 0; padding: 10px 0; border: 0; border-radius: 9px;
    background: transparent; color: #6B625A; font: inherit; font-size: 15px;
    font-weight: 700; cursor: pointer; transition: background .15s, color .15s, box-shadow .15s;
  }
  .seg button.is-on {
    background: #fff; color: var(--ink);
    box-shadow: 0 1px 4px rgba(28, 25, 23, .12);
  }

  .btn-main {
    display: flex; align-items: center; justify-content: center; width: 100%;
    min-height: 52px; border: 0; border-radius: 12px;
    background: var(--brand); color: #fff; font: inherit; font-size: 18px;
    font-weight: 800; cursor: pointer;
  }
  .btn-main:active { transform: translateY(1px); }
  .btn-main:disabled { background: #CFC8C0; cursor: not-allowed; transform: none; }
  .btn-main-alt {
    display: flex; align-items: center; justify-content: center; width: 100%;
    min-height: 44px; margin-top: 10px; border: 1.5px solid #DDD6CE;
    border-radius: 12px; background: #fff; color: #1C1917; font: inherit;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .btn-main-alt:disabled { color: #B6AF9F; background: #F6F2EC; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; align-items: stretch; margin-top: 14px; }
  .btn-row .btn-main { flex: 1 1 auto; margin-top: 0; }
  .btn-ghost {
    flex: 0 0 auto; padding: 0 14px; border: 1.5px solid #DDD6CE; border-radius: 10px;
    background: #fff; color: #6B625A; font: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .btn-ghost:hover { border-color: var(--brand); color: #B45309; }

  .demo-row {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
    padding: 10px 12px; border-radius: 10px; background: #FCFAF7;
    border: 1px dashed #E5DCD2; font-size: 12px; color: #78716C;
    flex-wrap: wrap;
  }
  .demo-label { font-weight: 700; color: #6B625A; }
  .demo-thumb {
    width: 48px; height: 48px; border-radius: 6px; object-fit: cover;
    border: 1px solid #E5DCD2; background: #fff;
    image-rendering: pixelated;
  }
  .demo-arrow { color: #A8A29E; font-weight: 700; }
  .demo-caption { color: #A8A29E; margin-left: 2px; }

  .hint { min-height: 21px; margin: 12px 0 0; font-size: 13px; line-height: 1.5; color: #B91C1C; font-weight: 600; }
  .tipbox {
    margin-top: 16px; padding: 12px 14px; border-radius: 10px;
    background: #F3EDE6; border: 1px solid #E5DCD2;
    font-size: 13px; line-height: 1.6; color: #6B625A;
  }

  .stage-empty {
    display: flex; align-items: center; justify-content: center;
    width: 100%; max-width: 420px; aspect-ratio: 1 / 1; margin: 0 auto;
    border: 2px dashed #D8CFC5; border-radius: 16px; background: #FCFAF7;
    color: #A8A29E; font-size: 15px; text-align: center; padding: 24px;
  }
  #stage {
    display: block; max-width: 100%; height: auto; margin: 0 auto;
    border-radius: 8px; background: #fff;
    box-shadow: 0 10px 30px rgba(28, 25, 23, .12);
  }
  .crop-wrap { max-width: 100%; }
  .crop-title {
    font-size: 13px; color: #6B625A; margin-bottom: 10px; text-align: center;
    font-weight: 600;
  }
  .crop-canvas {
    display: block; max-width: 100%; height: auto; margin: 0 auto;
    border-radius: 8px; background: #fff;
    box-shadow: 0 10px 30px rgba(28, 25, 23, .08);
    cursor: grab; touch-action: none;
  }
  .crop-canvas.is-dragging { cursor: grabbing; }
  .crop-canvas.is-resizing { cursor: nwse-resize; }
  .crop-actions {
    display: flex; gap: 12px; align-items: center; justify-content: center;
    margin-top: 14px;
  }
  .btn-main-lg {
    flex: 1 1 auto; min-height: 50px; padding: 0 24px; border: 0; border-radius: 12px;
    background: var(--brand); color: #fff; font: inherit; font-size: 17px;
    font-weight: 800; cursor: pointer; letter-spacing: .5px;
    box-shadow: 0 4px 12px rgba(217, 119, 87, .28);
  }
  .btn-main-lg:active { transform: translateY(1px); }
  .btn-ghost-sm {
    flex: 0 0 auto; padding: 0 14px; min-height: 50px;
    border: 1.5px solid #DDD6CE; border-radius: 12px;
    background: #fff; color: #6B625A; font: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .btn-ghost-sm:hover { border-color: var(--brand); color: #B45309; }

  @media (min-width: 768px) {
    .shell { padding: 28px 24px 48px; }
    .layout { flex-direction: row; align-items: flex-start; gap: 28px; }
    .panel { order: 1; width: 420px; flex: 0 0 420px; position: sticky; top: 24px; }
    .preview { order: 2; flex: 1 1 auto; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="mb-5">
    <h1 class="text-2xl md:text-3xl font-black tracking-tight">拼豆图纸 · 像素头像生成器</h1>
    <p class="mt-1 text-sm text-stone-500">上传图片 → 选参数 → 下载，全程本地处理不上传</p>
  </header>

  <div class="layout">
    <section class="panel" aria-label="设置">
      <h2 class="text-base font-bold">1. 上传图片</h2>
      <div class="mt-2">
        <input id="fileInput" type="file" accept="image/*" hidden>
        <button id="uploadBtn" class="upload" type="button">
          <span class="plus">+</span>
          <span class="upload-texts">
            <span id="uploadTitle">点这里选一张图片</span>
            <span id="uploadSub">头像、宠物、静物、Logo 都可以</span>
          </span>
        </button>
      </div>

      <div class="demo-row">
        <span class="demo-label">示例：</span>
        <img class="demo-thumb" src="demo_before.jpg" alt="原图示例">
        <span class="demo-arrow">→</span>
        <img class="demo-thumb" src="demo_after.png" alt="转后效果示例">
        <span class="demo-caption">原图 → 96×96 · 24 色</span>
      </div>

      <h2 class="text-base font-bold mt-6">2. 网格尺寸</h2>
      <div class="opt-grid mt-2">
        <button class="opt-card" type="button" data-size="32">
          <span class="opt-name">32 × 32</span>
          <span class="opt-meta">快、省豆子</span>
        </button>
        <button class="opt-card" type="button" data-size="48">
          <span class="opt-name">48 × 48</span>
          <span class="opt-meta">经典颗粒感</span>
        </button>
        <button class="opt-card is-active" type="button" data-size="96">
          <span class="opt-name">96 × 96</span>
          <span class="opt-meta">五官清晰 · 推荐</span>
        </button>
      </div>

      <h2 class="text-base font-bold mt-6">3. 最大颜色数量</h2>
      <div class="chip-row mt-2" id="colorChips">
        <button class="chip" type="button" data-colors="8">8 色</button>
        <button class="chip is-on" type="button" data-colors="16">16 色</button>
        <button class="chip" type="button" data-colors="24">24 色</button>
      </div>

      <h2 class="text-base font-bold mt-6">4. 导出模式</h2>
      <div class="seg mt-2" id="modeSeg">
        <button type="button" class="is-on" data-mode="avatar">像素头像</button>
        <button type="button" data-mode="pattern">拼豆图纸</button>
      </div>

      <div class="tipbox">
        小提示：上传后右侧会出现裁剪框，圈出主体 → 点大按钮生成。照片越聚焦主体效果越好。
      </div>

      <button id="downloadBtn" class="btn-main-alt" type="button" disabled>下载图片</button>
      <p class="mt-3 text-xs text-stone-400">图片只在你本地浏览器里处理，不会上传到任何服务器</p>
    </section>

    <section class="preview" aria-label="预览">
      <div id="emptyBox" class="stage-empty">先上传一张图片<br>这里会显示生成效果</div>
      <div id="cropBox" class="crop-wrap" hidden>
        <div class="crop-title">① 拖动框移动主体位置，拖边角缩放</div>
        <canvas id="cropCanvas" class="crop-canvas"></canvas>
      </div>
      <div class="crop-actions" id="cropActions" hidden>
        <button id="autoCropBtn" class="btn-ghost-sm" type="button">自动框一下</button>
        <button id="generateBtn" class="btn-main-lg" type="button">② 我选好了，生成像素图 →</button>
      </div>
      <canvas id="stage" width="512" height="512" hidden></canvas>
      <p id="stageMeta" class="mt-3 text-center text-xs text-stone-400" hidden></p>
      <div class="crop-actions" id="resultActions" hidden>
        <button id="reCropBtn" class="btn-ghost-sm" type="button">← 重新裁剪</button>
        <button id="downloadBtn2" class="btn-main-lg" type="button">下载图片</button>
      </div>
    </section>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
